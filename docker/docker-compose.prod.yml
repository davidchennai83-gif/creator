# Overlay; certificates must be supplied at nginx/certs/.
# DEPRECATED: superseded by docker/docker-compose.https.yml, where Caddy manages
# certificates automatically (no cert files). If you still want manual certs,
# disable the Caddy edge or nginx will loop behind it:
#   docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml up -d --scale caddy=0
services:
  backend:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      REQUIRE_REDIS: "true"
      ALLOW_REGISTRATION: "false"
    restart: unless-stopped
  nginx:
    ports:
      - "${HTTP_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
