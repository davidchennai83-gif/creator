user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # Caddy is the only published entry point. Build a spoof-proof per-client key
    # from the X-Forwarded-For it sends: Caddy appends the address it observed, so
    # the LAST entry is always the real client (client-supplied entries stop at
    # Caddy), and a lone entry IS that address. Plain $remote_addr would be the
    # Caddy container IP — throttling ALL clients as one bucket.
    map $http_x_forwarded_for $client_ip {
        ""                 $remote_addr;
        "~^.*,\s*([^,]+)\s*$" $1;
        default            $http_x_forwarded_for;
    }
    # Honour the scheme Caddy saw (https behind the auto-HTTPS edge); fall back to
    # our own scheme when the request did not arrive through it.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    limit_req_zone $client_ip zone=auth:10m rate=10r/m;
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:80; }
    server {
        listen 80;
        client_max_body_size 20m;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Single real client address — the backend's TRUST_PROXY limiter keys on
        # the first (here: only) entry, so spoofing stops at the edge.
        proxy_set_header X-Forwarded-For $client_ip;
        location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://backend; }
        location /api/ { proxy_pass http://backend; proxy_read_timeout 130s; }
        # Socket.IO (recorder agent + Live page) needs a WebSocket upgrade.
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location = /health { proxy_pass http://backend; }
        location = /ready { proxy_pass http://backend; }
        location / { proxy_pass http://frontend; }
    }
}
