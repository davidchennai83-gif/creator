user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:80; }
    server { listen 80; return 308 https://$host$request_uri; }
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://backend; }
        location /api/ { proxy_pass http://backend; proxy_read_timeout 130s; }
        location = /health { proxy_pass http://backend; }
        location = /ready { proxy_pass http://backend; }
        location / { proxy_pass http://frontend; }
    }
}
