name: creator-platform
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://creator:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/creator_platform
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    SERVER_HOST: 0.0.0.0
    STORAGE_PATH: /app/backend/storage
    # Caddy is the only published entry point (see the caddy service), so honour
    # its X-Forwarded-For.
    TRUST_PROXY: "true"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    # Honour the root .env auth profile inside the container too.
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    RECORDER_AGENT_TOKEN: ${RECORDER_AGENT_TOKEN:-}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  volumes:
    - media:/app/backend/storage
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: creator_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U creator -d creator_platform"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
  nginx:
    image: nginx:1.28-alpine
    # Internal only — Caddy is the published edge (it proxies to nginx:80).
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
  caddy:
    image: caddy:2-alpine
    environment:
      # :80 = plain HTTP for any Host; https://<domain> = auto-HTTPS (https overlay).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      NGINX_UPSTREAM: nginx:80
    ports:
      - "${HTTP_BIND:-127.0.0.1}:80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx: {condition: service_started}
  worker:
    <<: *backend
    profiles: [jobs]
    command: [python, -m, workers.worker]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    <<: *backend
    profiles: [jobs]
    command: [python, -m, workers.scheduler]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  media:
  caddy_data:
  caddy_config:
